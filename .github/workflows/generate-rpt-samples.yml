# GitHub Actions — Windows runner üzerinde Crystal Reports örnek dosya üretimi
#
# Strateji: Chocolatey ile CR Runtime kur → PowerShell ile rapor oluştur

name: Generate Crystal Report Samples

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Output directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path output -Force

      - name: Install ASP.NET 4.x feature (required by CrystalReports.Engine -> System.Web)
        shell: pwsh
        continue-on-error: true
        run: |
          # CR 13 Engine.dll, System.Web.UI.ParseChildrenAttribute referansı
          # taşıyor (legacy ASP.NET WebForms artığı). Windows Server 2022 cloud
          # runner'da default olarak System.Web.dll yok — Web-Asp-Net45 feature'ı
          # GAC'a kuruyor.
          Write-Host "=== Before install: System.Web.dll search ==="
          Get-ChildItem "C:\Windows\Microsoft.NET\assembly\GAC_MSIL" -Filter "System.Web.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 3 FullName
          Get-ChildItem "C:\Windows\Microsoft.NET\Framework64\v4.0.30319" -Filter "System.Web.dll" -ErrorAction SilentlyContinue | Select-Object -First 3 FullName

          Write-Host "=== Installing Web-Asp-Net45 (with management tools) ==="
          try {
              $result = Install-WindowsFeature -Name Web-Asp-Net45 -IncludeManagementTools -ErrorAction Stop
              Write-Host "Success: $($result.Success)"
              Write-Host "RestartNeeded: $($result.RestartNeeded)"
              Write-Host "ExitCode: $($result.ExitCode)"
              Write-Host "FeatureResult:"
              $result.FeatureResult | Format-Table -AutoSize | Out-String | Write-Host
          } catch {
              Write-Host "::warning::Install-WindowsFeature failed: $_"
              Write-Host "=== Falling back to DISM ==="
              # DISM offline-tarzı alternatif (IIS-ASPNET45 + parent dependencies)
              $features = @(
                  "IIS-WebServerRole",
                  "IIS-WebServer",
                  "IIS-CommonHttpFeatures",
                  "IIS-ApplicationDevelopment",
                  "IIS-NetFxExtensibility45",
                  "IIS-ISAPIExtensions",
                  "IIS-ISAPIFilter",
                  "IIS-ASPNET45"
              )
              foreach ($f in $features) {
                  & dism.exe /Online /Enable-Feature /FeatureName:$f /All /NoRestart 2>&1 | Out-String | Write-Host
              }
          }

          Write-Host "=== After install: System.Web.dll search ==="
          $sysWeb = Get-ChildItem "C:\Windows\Microsoft.NET" -Filter "System.Web.dll" -Recurse -ErrorAction SilentlyContinue
          if ($sysWeb) {
              Write-Host "Found $($sysWeb.Count) System.Web.dll files:"
              $sysWeb | Select-Object -First 10 | ForEach-Object {
                  $ver = (Get-Item $_.FullName).VersionInfo.FileVersion
                  Write-Host "  $($_.FullName)  [v$ver]"
              }
          } else {
              Write-Host "::warning::Still no System.Web.dll after install attempt"
          }

      - name: Show available package managers
        shell: pwsh
        run: |
          Write-Host "=== Chocolatey ==="
          choco --version
          Write-Host "=== Winget ==="
          winget --version 2>&1
          Write-Host "=== Existing CR DLLs (GAC) ==="
          Get-ChildItem "C:\Windows\Microsoft.NET\assembly" -Recurse -Filter "CrystalDecisions*.dll" -ErrorAction SilentlyContinue | Select-Object -First 5 FullName
          Write-Host "=== NuGet ==="
          nuget help 2>&1 | Select-Object -First 2

      - name: Search Chocolatey for Crystal packages
        shell: pwsh
        continue-on-error: true
        run: |
          choco search crystal --by-id-only 2>&1 | Select-Object -First 20

      - name: Install Crystal Reports Runtime via Chocolatey (correct package IDs)
        shell: pwsh
        continue-on-error: true
        id: choco_install
        run: |
          # Doğru paket adları (choco search ile bulundu):
          #   CrystalReports2010Runtime 13.0.36      ← ana hedef (CR 13, modern)
          #   CrystalReports2008Runtime 12.4.1       ← yedek (eski sürüm)
          #   crystalreports-for-visualstudio 13.0.34 ← VS entegrasyonu
          $packages = @("CrystalReports2010Runtime", "crystalreports-for-visualstudio", "CrystalReports2008Runtime")
          $installed = $false
          foreach ($pkg in $packages) {
            Write-Host "=== Attempting: choco install $pkg ==="
            choco install $pkg -y --no-progress --ignore-checksums --force 2>&1 | Out-String | Write-Host
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✓ Installed: $pkg"
              $installed = $true
              # Birden fazla paket dene (32-bit + 64-bit), continue
            } else {
              Write-Host "✗ Failed: $pkg (exit $LASTEXITCODE)"
            }
          }
          if (-not $installed) {
            Write-Host "::warning::No Chocolatey CR package succeeded"
          }

      - name: Try downloading Crystal Reports Runtime MSI directly
        shell: pwsh
        continue-on-error: true
        run: |
          # Bilinen public mirror URL'leri
          $urls = @(
            "https://github.com/majorsilence/CrystalCmd/releases/download/v3.0.0/CRRuntime_64bit_13_0_36.msi",
            "https://www.crystalreports.com/cr_redists/CRforVS_redist_install_64bit_13_0_36.zip"
          )
          foreach ($url in $urls) {
            try {
              Write-Host "Trying: $url"
              $out = "$env:TEMP\cr_runtime"
              New-Item -ItemType Directory -Path $out -Force | Out-Null
              $file = Split-Path $url -Leaf
              Invoke-WebRequest -Uri $url -OutFile "$out\$file" -ErrorAction Stop
              Write-Host "✓ Downloaded: $file ($((Get-Item "$out\$file").Length) bytes)"

              if ($file -like "*.zip") {
                Expand-Archive -Path "$out\$file" -DestinationPath $out -Force
                $msi = Get-ChildItem $out -Filter "*.msi" -Recurse | Select-Object -First 1
                if ($msi) {
                  Start-Process msiexec.exe -Wait -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart"
                  Write-Host "✓ MSI installed"
                }
              } elseif ($file -like "*.msi") {
                Start-Process msiexec.exe -Wait -ArgumentList "/i `"$out\$file`" /qn /norestart"
                Write-Host "✓ MSI installed"
              }
              break
            } catch {
              Write-Host "✗ Failed: $($_.Exception.Message)"
            }
          }

      - name: Locate Crystal DLLs after install
        shell: pwsh
        run: |
          Write-Host "=== Searching for CrystalDecisions DLLs ==="
          $found = @()
          $searchPaths = @(
            "C:\Program Files (x86)\SAP BusinessObjects",
            "C:\Program Files\SAP BusinessObjects",
            "C:\Windows\Microsoft.NET\assembly",
            "C:\ProgramData\Microsoft\VisualStudio",
            "C:\Program Files (x86)\Common Files\SAP BusinessObjects"
          )
          foreach ($path in $searchPaths) {
            if (Test-Path $path) {
              $dlls = Get-ChildItem $path -Recurse -Filter "CrystalDecisions*.dll" -ErrorAction SilentlyContinue
              foreach ($d in $dlls) { $found += $d.FullName }
            }
          }
          if ($found.Count -gt 0) {
            Write-Host "Found $($found.Count) CrystalDecisions DLLs:"
            $found | Select-Object -First 20 | ForEach-Object { Write-Host "  $_" }
            $found | Out-File "$env:GITHUB_WORKSPACE\crystal-dll-paths.txt"
          } else {
            Write-Host "::error::No CrystalDecisions DLLs found after installation attempts"
            Write-Host "::warning::Cannot proceed with PowerShell report generation"
          }

      - name: Modify-and-save existing RPT (Engine API — daha güvenilir)
        # ÖNEMLİ: shell=powershell (Windows PowerShell 5.1, .NET Framework 4.8 host).
        # CR Engine.dll legacy WebForms tipi (System.Web.UI.ParseChildrenAttribute)
        # arıyor — pwsh (PowerShell 7 = .NET 8/Core) altında System.Web shim
        # eksik tipler içeriyor. Windows PowerShell 5.1 .NET Framework 4.x üzerinde
        # çalıştığı için tüm WebForms namespace'i hazır.
        shell: powershell
        continue-on-error: true
        run: |
          $dllList = "$env:GITHUB_WORKSPACE\crystal-dll-paths.txt"
          if (-not (Test-Path $dllList)) {
            Write-Host "::warning::No CR DLLs available"
            exit 0
          }
          $dlls = Get-Content $dllList
          $engineDll = $dlls | Where-Object { $_ -like "*CrystalDecisions.CrystalReports.Engine*" } | Select-Object -First 1
          $sharedDll = $dlls | Where-Object { $_ -like "*CrystalDecisions.Shared*" } | Select-Object -First 1
          if (-not $engineDll) {
            Write-Host "::error::CrystalDecisions.CrystalReports.Engine.dll missing"
            exit 1
          }
          Write-Host "Loading: $engineDll"
          Add-Type -Path $engineDll
          if ($sharedDll) { Add-Type -Path $sharedDll }

          # Download a public RPT to use as template
          $templateUrl = "https://raw.githubusercontent.com/majorsilence/CrystalCmd/master/thereport.rpt"
          $template = "$PWD\template.rpt"
          Invoke-WebRequest -Uri $templateUrl -OutFile $template
          Write-Host "Template downloaded: $((Get-Item $template).Length) bytes"

          function Modify-ReportText {
              param([string]$Output, [string]$NewText)
              $doc = New-Object CrystalDecisions.CrystalReports.Engine.ReportDocument
              $doc.Load($template)
              $modified = 0
              foreach ($section in $doc.ReportDefinition.Sections) {
                  foreach ($obj in $section.ReportObjects) {
                      try {
                          if ($obj.Kind.ToString() -eq "TextObject") {
                              $textObj = [CrystalDecisions.CrystalReports.Engine.TextObject]$obj
                              Write-Host "  Modifying text: '$($textObj.Text)' -> '$NewText'"
                              $textObj.Text = $NewText
                              $modified++
                          } elseif ($obj.Kind.ToString() -eq "FieldObject") {
                              # FieldObject - skip (type may not match)
                          }
                      } catch {
                          Write-Host "  Skipped object: $($_.Exception.Message)"
                      }
                  }
              }
              Write-Host "Modified $modified objects in $Output"
              $doc.SaveAs($Output)
              $doc.Close()
              if (Test-Path $Output) {
                  Write-Host "[OK] Saved: $Output ($((Get-Item $Output).Length) bytes)"
              }
          }

          try {
              Modify-ReportText -Output "$PWD\output\modified-v1.rpt" -NewText "AAAAAAAA"
              Modify-ReportText -Output "$PWD\output\modified-v2.rpt" -NewText "BBBBBBBB"
              Modify-ReportText -Output "$PWD\output\modified-v3.rpt" -NewText "CCCCCCCC"
              # Save the unchanged template too (control sample)
              Copy-Item $template "$PWD\output\template-asis.rpt"
              Write-Host "[OK] All samples ready"
          } catch {
              Write-Host "::error::Modification failed: $_"
              Write-Host $_.ScriptStackTrace
              exit 1
          }

      - name: Fallback — copy public sample RPTs from internet
        shell: pwsh
        run: |
          # Eğer CR runtime ile rapor üretemediysek, internet'ten benzer örnek dosyaları çek
          $count = (Get-ChildItem output -Filter *.rpt -ErrorAction SilentlyContinue | Measure-Object).Count
          if ($count -gt 0) {
            Write-Host "Already have $count generated RPTs, no fallback needed"
            return
          }
          Write-Host "::warning::No generated RPTs — fetching public samples instead"
          $urls = @{
            "fallback-cmd-thereport.rpt" = "https://raw.githubusercontent.com/majorsilence/CrystalCmd/master/thereport.rpt"
          }
          foreach ($name in $urls.Keys) {
            try {
              Invoke-WebRequest -Uri $urls[$name] -OutFile "output/$name"
              Write-Host "✓ Downloaded: $name"
            } catch {
              Write-Host "✗ Failed to download $name"
            }
          }

      - name: List final samples
        shell: pwsh
        run: |
          Write-Host "Final RPT files in output/:"
          Get-ChildItem output -Filter *.rpt -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "  $($_.Name) - $($_.Length) bytes"
          }

      - name: Upload samples as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpt-samples
          path: |
            output/*.rpt
            crystal-dll-paths.txt
          retention-days: 30
          if-no-files-found: warn
